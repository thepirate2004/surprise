<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Anjali</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

    :root {
      --background: hsl(42 48% 94%);
      --foreground: hsl(21 26% 19%);
      --card: hsl(40 55% 97%);
      --border: hsl(37 24% 82%);
      --primary: hsl(343 36% 43%);
      --accent: hsl(42 66% 64%);
      --secondary: hsl(93 18% 70%);
      --muted: hsl(40 30% 89%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      background:
        radial-gradient(ellipse at 15% 0%, hsl(42 66% 88%) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 10%, hsl(93 18% 88%) 0%, transparent 50%),
        var(--background);
      overflow-x: hidden;
      font-family: 'Patrick Hand', cursive;
      color: var(--foreground);
      perspective: 1400px;
    }

    .site-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 17px;
      color: var(--foreground);
      text-decoration: none;
    }

    .wordmark-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--card);
      font-size: 14px;
    }

    .wordmark em {
      font-style: normal;
      color: hsl(21 12% 45%);
      font-weight: 400;
      font-size: 13px;
      margin-left: 2px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: 'Patrick Hand', cursive;
      font-size: 15px;
    }

    .site-nav a {
      color: var(--foreground);
      text-decoration: none;
    }

    .site-nav a:hover {
      color: var(--primary);
    }

    .hero-title {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 44px 14px 4px;
    }

    .hero-title h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: clamp(28px, 6vw, 46px);
      color: var(--primary);
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 0 rgba(255, 255, 255, .6);
    }

    .hero-title p {
      font-family: 'Patrick Hand', cursive;
      font-size: 16px;
      color: hsl(21 12% 45%);
      margin-top: 4px;
    }

    .site-footer {
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 20px 34px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-family: 'Patrick Hand', cursive;
      color: hsl(21 12% 45%);
      font-size: 14px;
    }

    .site-footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .chain-wrap {
      position: relative;
      z-index: 2;
      max-width: 480px;
      margin: 30px auto 70px;
    }

    svg.wire-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: visible;
    }

    .wire-path {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2.5;
      stroke-dasharray: 1 7;
      stroke-linecap: round;
      opacity: .55;
    }

    .bulb-row.right {
      justify-content: flex-end;
      padding-right: 10%;
    }

    .bulb-row.left {
      justify-content: flex-start;
      padding-left: 10%;
    }

    .bulb-row.center {
      justify-content: center;
    }

    .bulb-row {
      display: flex;
    }

    .bulb {
      position: relative;
      width: 196px;
      transform-style: preserve-3d;
      animation: sway 6.5s ease-in-out infinite, blinkGlow 2.6s ease-in-out infinite;
      animation-delay: var(--d), var(--d);
      cursor: pointer;
    }

    .clip {
      width: 26px;
      height: 15px;
      margin: 0 auto -2px;
      background: linear-gradient(180deg, hsl(42 66% 70%), var(--primary));
      border-radius: 3px 3px 0 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
    }

    .frame {
      position: relative;
      width: 196px;
      height: 212px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 10px 28px 10px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .4) inset,
        0 12px 26px rgba(80, 50, 30, .24),
        0 0 20px 3px hsl(42 66% 64% / .55);
      transform: rotateY(0deg) rotateX(0deg);
      animation: tilt3d 7s ease-in-out infinite;
      animation-delay: var(--d);
    }

    .frame .photo {
      width: 100%;
      height: 156px;
      overflow: hidden;
      border-radius: 4px;
      background: var(--muted);
    }

    .frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .frame .cap {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Patrick Hand', cursive;
      font-size: 14px;
      color: hsl(21 12% 45%);
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 8px;
      box-shadow: 0 0 20px 6px hsl(42 66% 64% / .5);
      opacity: .7;
      pointer-events: none;
      animation: pulseRing 2.6s ease-in-out infinite;
      animation-delay: var(--d);
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotate(-3.5deg) translateY(0);
      }

      50% {
        transform: rotate(3.5deg) translateY(5px);
      }
    }

    @keyframes tilt3d {

      0%,
      100% {
        transform: rotateY(-14deg) rotateX(3deg);
      }

      50% {
        transform: rotateY(14deg) rotateX(-3deg);
      }
    }

    @keyframes blinkGlow {

      0%,
      100% {
        filter: brightness(1) saturate(1);
      }

      50% {
        filter: brightness(1.18) saturate(1.1);
      }
    }

    @keyframes pulseRing {

      0%,
      100% {
        opacity: .25;
        transform: scale(1);
      }

      50% {
        opacity: .8;
        transform: scale(1.05);
      }
    }

    @media (max-width:480px) {
      .bulb {
        width: 148px;
      }

      .frame {
        width: 148px;
        height: 164px;
      }

      .frame .photo {
        height: 120px;
      }

      .bulb-row.right {
        padding-right: 4%;
      }

      .bulb-row.left {
        padding-left: 4%;
      }

      .site-header {
        padding: 14px 16px;
      }

      .site-nav {
        gap: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>

    ];

    const wrap = document.getElementById('chain');
    wrap.style.position = "relative";

    const rowsCount = IMAGES.length;
    const rowH = 300;
    const svgH = rowsCount * rowH + 80;
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "wire-svg");
    svg.setAttribute("viewBox", `0 0 480 ${svgH}`);
    svg.setAttribute("preserveAspectRatio", "none");

    const patternX = [240, 340, 140];
    const positions = IMAGES.map((_, i) => ({
      x: patternX[i % 3],
      y: 140 + i * rowH
    }));

    let d = `M ${positions[0].x} 6`;
    positions.forEach((p, i) => {
      const prevY = i === 0 ? 6 : positions[i - 1].y;
      const midY = (prevY + p.y) / 2;
      d += ` Q ${p.x} ${midY} ${p.x} ${p.y}`;
    });
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("class", "wire-path");
    path.setAttribute("d", d);
    svg.appendChild(path);
    wrap.appendChild(svg);
    wrap.style.minHeight = svgH + "px";

    const rowClasses = ["center", "right", "left"];
    IMAGES.forEach((src, i) => {
      const row = document.createElement("div");
      row.className = "bulb-row " + rowClasses[i % 3];
      row.style.position = "absolute";
      row.style.top = (positions[i].y - 115) + "px";
      row.style.left = "0";
      row.style.right = "0";

      const bulb = document.createElement("div");
      bulb.className = "bulb";
      bulb.style.setProperty("--d", (i * 0.35) + "s");

      const clip = document.createElement("div");
      clip.className = "clip";

      const frame = document.createElement("div");
      frame.className = "frame";
      const photo = document.createElement("div");
      photo.className = "photo";
      const img = document.createElement("img");
      img.src = src;
      img.loading = "lazy";
      img.alt = "memory " + (i + 1);
      photo.appendChild(img);
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.textContent = "#" + (i + 1);
      frame.appendChild(photo);
      frame.appendChild(cap);

      bulb.appendChild(clip);
      bulb.appendChild(frame);
      row.appendChild(bulb);
      wrap.appendChild(row);
    });

  </script>
